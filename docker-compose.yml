services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/horizon.db
      SEED_ON_START: "${SEED_ON_START:-true}"
      HORIZON_WATCH_DIR: /watch
    volumes:
      - horizon-data:/data
      - ./watch:/watch

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  horizon-data:
